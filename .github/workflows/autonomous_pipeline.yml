name: Autonomous MLOps & Benchmark Pipeline

on:
  schedule:
    # Runs 4 times a day (every 6 hours) autonomously forever
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/autonomous_pipeline.yml'

permissions:
  contents: write
  issues: write

jobs:
  benchmark-and-evaluate:
    if: github.repository == 'festomanolo/Sw-SL'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Autonomous Evaluation Cycle
        run: |
          chmod +x scripts/autonomous_benchmark.py
          python scripts/autonomous_benchmark.py

      - name: Commit and Push Autonomous Benchmark Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md benchmarks/
          
          if git diff --staged --quiet; then
            echo "No benchmark changes detected."
          else
            COMMIT_MSG=$(cat benchmarks/latest_commit_message.txt 2>/dev/null || echo "perf(eval): autonomous cycle benchmark update [skip ci]")
            git commit -m "$COMMIT_MSG"
            git push
          fi

      - name: Automated Anomaly Issue Triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Check if an anomaly alert was triggered
          if [ -f "benchmarks/anomaly_alert.json" ]; then
            CYCLE=$(python3 -c "import json; d=json.load(open('benchmarks/anomaly_alert.json')); print(d.get('cycle', 'N/A'))")
            REASON=$(python3 -c "import json; d=json.load(open('benchmarks/anomaly_alert.json')); print(d.get('reason', 'Unknown anomaly'))")
            TOP_ACC=$(python3 -c "import json; d=json.load(open('benchmarks/anomaly_alert.json')); print(d.get('top_accuracy', 'N/A'))")
            LATENCY=$(python3 -c "import json; d=json.load(open('benchmarks/anomaly_alert.json')); print(d.get('p95_latency', 'N/A'))")
            DRIFT=$(python3 -c "import json; d=json.load(open('benchmarks/anomaly_alert.json')); print(d.get('signer_drift', 'N/A'))")
            
            EXISTING_ISSUE=$(gh issue list --search "[Auto-Audit] Anomaly Alert" --state open --json number --jq '.[0].number')
            
            ISSUE_BODY=$(cat << EOF
          ### Automated MLOps Audit Alert: Performance Drift Detected
          
          **Evaluation Cycle:** #$CYCLE  
          **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")  
          **Status:** ⚠️ Performance Anomaly Detected
          
          #### Diagnostic Telemetry
          | Metric | Measured Value | Threshold | Status |
          |---|---|---|---|
          | **Top Accuracy** | \`$TOP_ACC%\` | $\ge 92.0\%$ | Trigger Condition |
          | **Latency p95** | \`$LATENCY ms\` | $\le 33.33 ms$ | Real-Time Frame Budget |
          | **Signer Drift** | \`$DRIFT%\` | $\le 6.0\%$ | Inter-Signer Covariance |
          
          #### Anomaly Description
          > $REASON
          
          *This issue was automatically generated by the autonomous evaluation pipeline. It will automatically resolve when subsequent evaluation cycles recover within baseline tolerances.*
          EOF
          )
            
            if [ -z "$EXISTING_ISSUE" ]; then
              gh issue create --title "[Auto-Audit] Anomaly Alert: Model Performance Drift in Cycle #$CYCLE" \
                              --body "$ISSUE_BODY"
              echo "Opened new anomaly issue."
            else
              gh issue comment "$EXISTING_ISSUE" --body "Update from Cycle #$CYCLE: Anomaly persists — $REASON"
              echo "Updated existing anomaly issue #$EXISTING_ISSUE."
            fi
          fi
          
          # 2. Check if a previous anomaly was resolved
          if [ -f "benchmarks/anomaly_resolved.json" ]; then
            RESOLVED_CYCLE=$(python3 -c "import json; d=json.load(open('benchmarks/anomaly_resolved.json')); print(d.get('cycle', 'N/A'))")
            RECOVERY_ACC=$(python3 -c "import json; d=json.load(open('benchmarks/anomaly_resolved.json')); print(d.get('accuracy', 'N/A'))")
            
            EXISTING_ISSUE=$(gh issue list --search "[Auto-Audit] Anomaly Alert" --state open --json number --jq '.[0].number')
            if [ -n "$EXISTING_ISSUE" ]; then
              gh issue close "$EXISTING_ISSUE" --comment "🟢 **RESOLVED in Cycle #$RESOLVED_CYCLE**: Benchmark metrics recovered to nominal baseline (Accuracy: \`$RECOVERY_ACC%\`). All real-time latency and statistical significance thresholds satisfied."
              echo "Closed anomaly issue #$EXISTING_ISSUE with resolution notice."
            fi
            rm -f benchmarks/anomaly_resolved.json
          fi
