name: Autonomous MLOps & Benchmark Pipeline

on:
  schedule:
    # Runs 4 times a day (every 6 hours) autonomously forever
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/autonomous_pipeline.yml'

permissions:
  contents: write

jobs:
  benchmark-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Autonomous Evaluation Cycle
        run: |
          chmod +x scripts/autonomous_benchmark.py
          python scripts/autonomous_benchmark.py

      - name: Commit and Push Autonomous Benchmark Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md benchmarks/autonomous_history.json
          
          if git diff --staged --quiet; then
            echo "No benchmark changes detected."
          else
            CYCLE=$(python3 -c "import json; h=json.load(open('benchmarks/autonomous_history.json')); print(h[-1]['cycle'])")
            TOP_ACC=$(python3 -c "import json; h=json.load(open('benchmarks/autonomous_history.json')); print(h[-1]['top_accuracy'])")
            TOP_MODEL=$(python3 -c "import json; h=json.load(open('benchmarks/autonomous_history.json')); print(h[-1]['top_model'])")
            git commit -m "chore(autonomous): evaluation cycle #$CYCLE - $TOP_MODEL ($TOP_ACC%) [skip ci]"
            git push
          fi
